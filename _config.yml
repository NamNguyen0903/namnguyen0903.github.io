# Site settings
title: "Jekyll Resume Template"
description: "A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Nguyen Trong Nam"
resume_title:                   "Software Developer"
resume_contact_email:           "namtronghlg0903@gmail.com"
resume_contact_telephone:       "0123-456-789"
resume_contact_address:         "Ho Chi Minh, Viet Nam"

resume_header_contact_info:     "Ho Chi Minh, Viet Nam • 0123-456-789 • namtronghlg0903@gmail.com"

resume_header_intro: "<p>Software Developer with experience in Java, ReactJS, and Node.js. Passionate about building scalable web applications and learning new technologies.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     false
resume_section_links:           true
resume_section_associations:    false
resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/NamNguyen0903"
  resume_twitter_url:           "https://twitter.com/yourusername"
  resume_linkedin_url:          "https://www.linkedin.com/in/your-profile"
  resume_website_url:           "https://yourwebsite.com"

resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts
